<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="fleetGradPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="50%" stop-color="#4FACFE"/>
      <stop offset="100%" stop-color="#0061FF"/>
    </linearGradient>
    <linearGradient id="fleetGradAccent" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#50E3C2"/>
    </linearGradient>
    <linearGradient id="fleetBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(14, 23, 42, 0.95)"/>
      <stop offset="100%" stop-color="rgba(3, 7, 18, 0.98)"/>
    </linearGradient>
    <filter id="fleetGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Modern Geometric Fleet Shield Chassis -->
  <path d="M32 5L55 16.5V39.5L32 57L9 39.5V16.5L32 5Z" fill="url(#fleetBgGrad)" stroke="url(#fleetGradPrimary)" stroke-width="2" stroke-linejoin="round"/>
  
  <!-- Subtle Internal Grid Radar -->
  <path d="M32 5V57" stroke="rgba(79, 172, 254, 0.2)" stroke-width="1.2" stroke-dasharray="3 2"/>
  <path d="M9 28H55" stroke="rgba(79, 172, 254, 0.15)" stroke-width="1.2" stroke-dasharray="3 2"/>

  <!-- High Velocity 'F' Monogram Wings -->
  <path d="M22 20H43.5C45.8 20 47.3 22.3 46.3 24.4L44 29H28L25.5 40H19.5L22 20Z" fill="url(#fleetGradPrimary)" filter="url(#fleetGlow)"/>
  <path d="M27.5 30H41C42.9 30 44.1 31.9 43.3 33.6L40.5 39.5H25.5L27.5 30Z" fill="url(#fleetGradAccent)"/>

  <!-- Connected Pulse Nodes -->
  <circle cx="48" cy="18" r="2.5" fill="#00F2FE" filter="url(#fleetGlow)"/>
  <circle cx="16" cy="45" r="2" fill="#50E3C2"/>
</svg>
