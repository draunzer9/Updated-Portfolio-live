<svg viewBox="0 0 64 64" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="deltaGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F2FE"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
    <linearGradient id="deltaGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#6366F1"/>
    </linearGradient>
    <linearGradient id="deltaGrad3" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10B981"/>
      <stop offset="100%" stop-color="#00F2FE"/>
    </linearGradient>
    <linearGradient id="deltaBgGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="rgba(15, 23, 42, 0.95)"/>
      <stop offset="100%" stop-color="rgba(2, 6, 23, 0.98)"/>
    </linearGradient>
    <filter id="deltaGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer Angled Cyber Hex Badge -->
  <polygon points="32,4 56,16 56,48 32,60 8,48 8,16" fill="url(#deltaBgGlass)" stroke="rgba(56, 189, 248, 0.4)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Top Delta Wing: R&D Lead Node -->
  <path d="M32 12L46 22L32 30L18 22L32 12Z" fill="url(#deltaGrad1)" filter="url(#deltaGlow)"/>

  <!-- Right Supersonic Wing: Workshop Tech Node -->
  <path d="M48 25L48 45L34 37L34 32L48 25Z" fill="url(#deltaGrad2)"/>

  <!-- Left Supersonic Wing: Test Driver Node -->
  <path d="M16 25L30 32L30 37L16 45L16 25Z" fill="url(#deltaGrad3)"/>

  <!-- Central Telemetry Core Node -->
  <circle cx="32" cy="34" r="3.5" fill="#00F2FE" filter="url(#deltaGlow)"/>
  <circle cx="32" cy="34" r="1.5" fill="#FFFFFF"/>
</svg>
